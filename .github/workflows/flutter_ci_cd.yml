name: Flutter CI/CD
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'  # Run on all branches
    tags:
      - 'v*'  # Also run on version tags
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.4'
        channel: 'stable'
        cache: true
    
    - name: Create local.properties
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        echo "Created local.properties with Flutter SDK: $FLUTTER_ROOT"
        cat android/local.properties
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Clean build
      run: flutter clean
    
    - name: Clear Gradle cache
      run: |
        cd android
        rm -rf .gradle build app/build
        echo "Gradle cache cleared"
    
    - name: Precache Flutter artifacts
      run: |
        flutter precache --android --force
        echo "Flutter artifacts precached"
        echo "Checking for engine artifacts:"
        find "$FLUTTER_ROOT" -type d -name "android" -path "*/artifacts/engine/*" 2>/dev/null | head -5 || echo "No android artifacts found"
        echo "Flutter cache structure:"
        ls -la "$FLUTTER_ROOT/bin/cache/" 2>/dev/null || echo "Cache directory not found"
        echo ""
        echo "=== Checking Flutter engine version ==="
        cat "$FLUTTER_ROOT/bin/internal/engine.version" 2>/dev/null || echo "Engine version file not found"
        echo ""
        echo "=== Checking for Flutter embedding in local artifacts ==="
        find "$FLUTTER_ROOT/bin/cache/artifacts/engine" -name "*embedding*" -type f 2>/dev/null | head -10 || echo "No embedding artifacts found locally"
    
    - name: Verify Flutter setup
      run: |
        flutter doctor -v
        echo "Flutter SDK: $FLUTTER_ROOT"
        echo "Verifying local.properties exists:"
        cat android/local.properties || echo "local.properties not found!"
    
    - name: Verify Gradle configuration
      run: |
        cd android
        echo "Checking Gradle wrapper:"
        ./gradlew --version || true
        echo ""
        echo "Checking if Flutter Gradle plugin is available:"
        ./gradlew tasks --all 2>&1 | grep -i flutter || echo "No Flutter tasks found"
        echo ""
        echo "Checking project structure:"
        ./gradlew projects 2>&1 | head -20 || true
        echo ""
        echo "=== Verifying Flutter SDK path ==="
        echo "FLUTTER_ROOT: $FLUTTER_ROOT"
        echo "Checking Flutter Gradle plugin location:"
        ls -la "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>&1 | head -10 || echo "Flutter Gradle plugin not found"
        echo ""
        echo "=== Checking local.properties ==="
        cat local.properties || echo "local.properties not found"
 
    - name: Generate code
      run: flutter pub run build_runner build --delete-conflicting-outputs || true
    
    - name: Run tests
      run: flutter test --no-pub
      continue-on-error: true
    
    - name: Analyze code
      run: flutter analyze
      continue-on-error: true
    
    - name: Check dependency resolution
      run: |
        cd android
        echo "=== Checking dependency resolution ==="
        ./gradlew :app:dependencies --configuration releaseRuntimeClasspath 2>&1 | tee deps.log || true
        echo ""
        echo "=== Searching for Flutter embedding in dependencies ==="
        grep -i "flutter\|embedding\|io.flutter" deps.log | head -50 || echo "No Flutter dependencies found"
        echo ""
        echo "=== Checking for unresolved dependencies ==="
        grep -i "FAILED\|unresolved\|could not find\|could not resolve" deps.log | head -50 || echo "No unresolved dependencies found"
    
    - name: Build APK
      run: |
        echo "Building APK with Flutter..."
        cd android
        # Capture full Gradle output with detailed error information
        ./gradlew :app:assembleRelease --stacktrace --info 2>&1 | tee build.log || {
          echo "=== BUILD FAILED ==="
          echo ""
          echo "=== Full Kotlin compilation errors ==="
          # Look for Kotlin compilation errors in the log
          grep -A 20 "e: file:" build.log | head -200 || true
          echo ""
          echo "=== Unresolved reference errors ==="
          grep -i "unresolved\|cannot find\|symbol\|class\|package" build.log | head -100 || true
          echo ""
          echo "=== Dependency resolution errors ==="
          grep -i "could not find\|could not resolve\|FAILED" build.log | head -100 || true
          echo ""
          echo "=== Last 300 lines of build log ==="
          tail -300 build.log
          echo ""
          echo "=== Running compileReleaseKotlin with full output ==="
          ./gradlew :app:compileReleaseKotlin --stacktrace --info 2>&1 | tee kotlin.log || true
          echo ""
          echo "=== Kotlin compilation errors (detailed) ==="
          grep -A 10 "e: file:" kotlin.log | head -200 || true
          echo ""
          echo "=== Checking Flutter embedding availability ==="
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath 2>&1 | grep -A 10 -B 10 "io.flutter" || echo "No io.flutter dependencies found"
          exit 1
        }
        cd ..
        # Copy APK to expected location
        cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk || true
    
    # Get branch name and commit info for all pushes
    - name: Get branch name
      if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
      id: branch_name
      run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
    
    - name: Get commit info
      if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
      id: commit_info
      run: |
        echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_msg=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT
    
    # Sanitize branch name and prepare tag
    - name: Prepare release tag
      if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
      id: prepare_tag
      run: |
        BRANCH_NAME="${{ steps.branch_name.outputs.branch }}"
        # Replace / with - in branch name for tag compatibility
        TAG_NAME="branch-${BRANCH_NAME//\//-}"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
    
    # Delete previous release for this branch (keeps only one per branch)
    - name: Delete previous release for this branch
      if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      run: |
        gh release delete "${{ steps.prepare_tag.outputs.tag_name }}" --yes --cleanup-tag || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Rename APK for better organization
    - name: Rename APK for main branch
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cp build/app/outputs/flutter-apk/app-release.apk app-main-latest.apk
    
    - name: Rename APK for other branches
      if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
      run: |
        cp build/app/outputs/flutter-apk/app-release.apk app-${{ steps.branch_name.outputs.branch }}.apk
    
    - name: Rename APK for version tags
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cp build/app/outputs/flutter-apk/app-release.apk app-${{ github.ref_name }}.apk
    
    # Create release for main branch
    - name: Create Latest Release (Main Branch)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: branch-main
        name: Latest (Main Branch)
        body: |
          📱 Latest build from main branch
          
          **Commit:** ${{ steps.commit_info.outputs.short_sha }}
          **Message:** ${{ steps.commit_info.outputs.commit_msg }}
        files: app-main-latest.apk
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Create release for other branches
    - name: Create Branch Release
      if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.prepare_tag.outputs.tag_name }}
        name: Branch - ${{ steps.branch_name.outputs.branch }}
        body: |
          🔧 Development build from **${{ steps.branch_name.outputs.branch }}** branch
          
          **Commit:** ${{ steps.commit_info.outputs.short_sha }}
          **Message:** ${{ steps.commit_info.outputs.commit_msg }}
          
          This is a development build (not production)
        files: app-${{ steps.branch_name.outputs.branch }}.apk
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Create release for version tags
    - name: Create Version Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Official Release ${{ github.ref_name }}
        files: app-${{ github.ref_name }}.apk
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
